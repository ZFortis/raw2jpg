<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAW 转 JPG</title>
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
            --border: #334155;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #22c55e;
            --success-hover: #16a34a;
            --zip: #8b5cf6;
            --zip-hover: #7c3aed;
            --disabled: #475569;
            --loading-bg: #1e3a5f;
            --loading-text: #93c5fd;
            --error-bg: #450a0a;
            --error-text: #fca5a5;
            --status-waiting: #fbbf24;
            --status-processing: #93c5fd;
            --status-done: #22c55e;
            --status-error: #f87171;
            --btn-text: #fff;
        }

        :root[data-theme="light"] {
            --bg: #FFF6DE;
            --surface: #FFFFFF;
            --text: #1e293b;
            --text-muted: #64748b;
            --text-dim: #94a3b8;
            --border: #8BDFDD;
            --accent: #8BDFDD;
            --accent-hover: #6cc7c3;
            --success: #F48F68;
            --success-hover: #e07a54;
            --zip: #FFE394;
            --zip-hover: #f0d272;
            --disabled: #cbd5e1;
            --loading-bg: #e0f7f7;
            --loading-text: #3a8f8b;
            --error-bg: #fee2e2;
            --error-text: #dc2626;
            --status-waiting: #d97706;
            --status-processing: #3a8f8b;
            --status-done: #F48F68;
            --status-error: #dc2626;
            --btn-text: #1e293b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s, color 0.3s;
        }

        .container {
            width: 100%;
            max-width: 560px;
            padding: 24px;
            position: relative;
        }

        /* Theme toggle */
        .theme-toggle {
            position: absolute;
            top: 0;
            right: 0;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 20px;
            width: 40px;
            height: 40px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, border-color 0.2s;
            z-index: 10;
        }
        .theme-toggle:hover {
            border-color: var(--accent);
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 32px;
        }

        .drop-zone {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 48px 24px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            background: var(--surface);
        }

        .drop-zone:hover,
        .drop-zone.dragover {
            border-color: var(--accent);
        }

        .drop-zone .icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .drop-zone p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .drop-zone .formats {
            color: var(--text-dim);
            font-size: 12px;
            margin-top: 8px;
        }

        #file-input { display: none; }

        .btn {
            display: inline-block;
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary {
            background: var(--accent);
            color: var(--btn-text);
            margin-top: 16px;
        }

        .btn-primary:hover { background: var(--accent-hover); }
        .btn-primary:disabled {
            background: var(--disabled);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        .btn-download {
            background: var(--success);
            color: var(--btn-text);
            width: 100%;
            margin-top: 16px;
            text-align: center;
            text-decoration: none;
        }

        .btn-download:hover { background: var(--success-hover); }

        .result {
            margin-top: 24px;
            display: none;
        }

        .result.show { display: block; }

        .status {
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
        }

        .status.loading {
            background: var(--loading-bg);
            color: var(--loading-text);
        }

        .status.error {
            background: var(--error-bg);
            color: var(--error-text);
        }

        .preview-img {
            width: 100%;
            border-radius: 8px;
            margin-top: 16px;
            display: none;
        }

        /* File list */
        .file-list {
            margin-top: 16px;
            display: none;
            flex-direction: column;
            gap: 8px;
        }

        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--surface);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 13px;
            gap: 12px;
        }

        .file-item .file-item-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--text);
            min-width: 0;
        }

        .file-item .file-item-status {
            flex-shrink: 0;
            font-size: 12px;
            white-space: nowrap;
        }

        .file-item-status.waiting { color: var(--status-waiting); }
        .file-item-status.processing { color: var(--status-processing); }
        .file-item-status.done { color: var(--status-done); }
        .file-item-status.error { color: var(--status-error); }

        .file-item .file-item-download {
            flex-shrink: 0;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            color: var(--btn-text);
            background: var(--accent);
            transition: background 0.2s;
        }
        .file-item .file-item-download:hover { background: var(--accent-hover); }
        .file-item .file-item-download:disabled {
            background: var(--disabled);
            cursor: not-allowed;
        }

        .file-item .file-item-size {
            flex-shrink: 0;
            font-size: 11px;
            color: var(--text-dim);
        }

        /* Batch toolbar */
        .batch-toolbar {
            margin-top: 16px;
            text-align: center;
            display: none;
        }

        .btn-zip {
            background: var(--zip);
            color: var(--btn-text);
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            text-decoration: none;
        }
        .btn-zip:hover { background: var(--zip-hover); }
        .btn-zip:disabled {
            background: var(--disabled);
            cursor: not-allowed;
        }

        .batch-summary {
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 16px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="theme-toggle" id="theme-toggle" title="切换深浅模式">🌙</button>

        <h1>RAW → JPG</h1>
        <p class="subtitle">从 RAW 文件中提取嵌入的 JPG 预览图，支持批量处理</p>

        <div class="drop-zone" id="drop-zone">
            <div class="icon">📷</div>
            <p>拖拽 RAW 文件到此处，或点击选择</p>
            <p class="formats">支持 CR2 / NEF / ARW / DNG / RAF / ORF 等格式</p>
        </div>
        <input type="file" id="file-input" accept=".cr2,.nef,.arw,.dng,.raf,.orf,.rw2,.pef,.srw,.3fr,.raw" multiple>

        <div class="file-list" id="file-list"></div>
        <div class="batch-summary" id="batch-summary"></div>

        <button class="btn btn-primary" id="extract-btn" disabled>提取 JPG</button>

        <div class="batch-toolbar" id="batch-toolbar">
            <a class="btn btn-zip" id="zip-btn" style="display:none">下载全部 ZIP</a>
        </div>

        <div class="result" id="result">
            <div class="status loading" id="status" style="display:none"></div>
            <img class="preview-img" id="preview" alt="Preview">
            <a class="btn btn-download" id="download-btn" style="display:none" download>下载 JPG</a>
        </div>
    </div>

    <script>
        const themeToggle = document.getElementById("theme-toggle");
        const dropZone = document.getElementById("drop-zone");
        const fileInput = document.getElementById("file-input");
        const fileList = document.getElementById("file-list");
        const batchSummary = document.getElementById("batch-summary");
        const extractBtn = document.getElementById("extract-btn");
        const batchToolbar = document.getElementById("batch-toolbar");
        const zipBtn = document.getElementById("zip-btn");
        const result = document.getElementById("result");
        const status = document.getElementById("status");
        const preview = document.getElementById("preview");
        const downloadBtn = document.getElementById("download-btn");

        let selectedFiles = [];
        let batchId = null;

        // Theme
        function getTheme() {
            return localStorage.getItem("theme") || "dark";
        }

        function applyTheme(theme) {
            document.documentElement.dataset.theme = theme;
            themeToggle.textContent = theme === "light" ? "☀️" : "🌙";
            localStorage.setItem("theme", theme);
        }

        applyTheme(getTheme());

        themeToggle.addEventListener("click", () => {
            const next = getTheme() === "light" ? "dark" : "light";
            applyTheme(next);
        });

        dropZone.addEventListener("click", () => fileInput.click());

        dropZone.addEventListener("dragover", (e) => {
            e.preventDefault();
            dropZone.classList.add("dragover");
        });

        dropZone.addEventListener("dragleave", () => {
            dropZone.classList.remove("dragover");
        });

        dropZone.addEventListener("drop", (e) => {
            e.preventDefault();
            dropZone.classList.remove("dragover");
            handleFiles(e.dataTransfer.files);
        });

        fileInput.addEventListener("change", () => {
            handleFiles(fileInput.files);
        });

        function handleFiles(files) {
            if (!files || files.length === 0) return;
            selectedFiles = Array.from(files);
            batchId = null;

            if (selectedFiles.length === 1) {
                extractBtn.textContent = "提取 JPG";
            } else {
                extractBtn.textContent = "批量提取 JPG (" + selectedFiles.length + " 个文件)";
            }
            extractBtn.disabled = false;

            renderFileList();
            resetResult();
            resetBatchUI();
        }

        function renderFileList() {
            fileList.innerHTML = "";
            fileList.style.display = "flex";

            selectedFiles.forEach((file, idx) => {
                const item = document.createElement("div");
                item.className = "file-item";
                item.id = "file-item-" + idx;

                const sizeText = formatSize(file.size);

                item.innerHTML =
                    '<span class="file-item-name">' + escapeHtml(file.name) + '</span>' +
                    '<span class="file-item-size">' + sizeText + '</span>' +
                    '<span class="file-item-status waiting">待处理</span>' +
                    '<a class="file-item-download" style="display:none">下载</a>';

                fileList.appendChild(item);
            });
        }

        function resetResult() {
            result.classList.remove("show");
            status.style.display = "none";
            status.className = "status";
            preview.style.display = "none";
            downloadBtn.style.display = "none";
        }

        function resetBatchUI() {
            batchToolbar.style.display = "none";
            zipBtn.style.display = "none";
            batchSummary.style.display = "none";
        }

        extractBtn.addEventListener("click", async () => {
            if (selectedFiles.length === 0) return;

            resetResult();
            resetBatchUI();

            for (let i = 0; i < selectedFiles.length; i++) {
                const item = document.getElementById("file-item-" + i);
                if (!item) continue;
                const s = item.querySelector(".file-item-status");
                s.className = "file-item-status processing";
                s.textContent = "提取中...";
                const dl = item.querySelector(".file-item-download");
                dl.style.display = "none";
            }

            extractBtn.disabled = true;
            extractBtn.textContent = "提取中...";

            try {
                if (selectedFiles.length === 1) {
                    await extractSingle();
                } else {
                    await extractBatch();
                }
            } catch (err) {
                for (let i = 0; i < selectedFiles.length; i++) {
                    const item = document.getElementById("file-item-" + i);
                    if (!item) continue;
                    const s = item.querySelector(".file-item-status");
                    s.className = "file-item-status error";
                    s.textContent = err.message;
                }
            } finally {
                extractBtn.disabled = false;
                if (selectedFiles.length === 1) {
                    extractBtn.textContent = "提取 JPG";
                } else {
                    extractBtn.textContent = "批量提取 JPG";
                }
            }
        });

        async function extractSingle() {
            const formData = new FormData();
            formData.append("file", selectedFiles[0]);

            result.classList.add("show");
            preview.style.display = "none";
            downloadBtn.style.display = "none";

            status.style.display = "block";
            status.className = "status loading";
            status.textContent = "正在提取 JPG...";

            const resp = await fetch("/extract", { method: "POST", body: formData });

            if (!resp.ok) {
                const err = await resp.json();
                throw new Error(err.error || "提取失败");
            }

            const blob = await resp.blob();
            const url = URL.createObjectURL(blob);

            preview.src = url;
            preview.style.display = "block";
            downloadBtn.href = url;
            downloadBtn.style.display = "block";
            downloadBtn.download = selectedFiles[0].name.replace(/\.[^.]+$/, "") + ".jpg";

            status.style.display = "none";

            const item = document.getElementById("file-item-0");
            if (item) {
                const s = item.querySelector(".file-item-status");
                s.className = "file-item-status done";
                s.textContent = "完成";
                const dl = item.querySelector(".file-item-download");
                dl.style.display = "inline";
                dl.href = url;
                dl.download = selectedFiles[0].name.replace(/\.[^.]+$/, "") + ".jpg";
            }
        }

        async function extractBatch() {
            const formData = new FormData();
            for (const file of selectedFiles) {
                formData.append("files", file);
            }

            const resp = await fetch("/batch/extract", { method: "POST", body: formData });

            if (!resp.ok) {
                const err = await resp.json();
                throw new Error(err.error || "批量处理失败");
            }

            const data = await resp.json();
            batchId = data.batch_id;

            let successCount = 0;
            for (const fr of data.files) {
                const idx = parseInt(fr.id, 10);
                const item = document.getElementById("file-item-" + idx);
                if (!item) continue;

                const s = item.querySelector(".file-item-status");
                const dl = item.querySelector(".file-item-download");

                if (fr.status === "success") {
                    s.className = "file-item-status done";
                    s.textContent = "完成";
                    dl.style.display = "inline";
                    dl.href = "/batch/" + batchId + "/download/" + fr.id + "?name=" + encodeURIComponent(fr.output_name);
                    dl.download = fr.output_name || "output.jpg";
                    successCount++;
                } else {
                    s.className = "file-item-status error";
                    s.textContent = fr.error || "失败";
                    dl.style.display = "none";
                }
            }

            batchSummary.style.display = "block";
            batchSummary.textContent =
                "共 " + data.total_count + " 个文件，" +
                successCount + " 个成功，" +
                data.error_count + " 个失败";

            if (successCount >= 2) {
                batchToolbar.style.display = "block";
                zipBtn.style.display = "inline-block";
                zipBtn.href = "/batch/" + batchId + "/zip";
            }
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + " B";
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
            return (bytes / (1024 * 1024)).toFixed(1) + " MB";
        }

        function escapeHtml(str) {
            const div = document.createElement("div");
            div.textContent = str;
            return div.innerHTML;
        }
    </script>
</body>
</html>
